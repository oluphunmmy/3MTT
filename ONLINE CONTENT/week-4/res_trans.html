<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive/Transition Design</title>
    <link rel="stylesheet" href="restran.css" >
</head>
<body>
    <header id="header">
        <h1>Advanced CSS Webpage</h1>
    </header>

    <!-- Flexbox Layout -->
    <section class="content-section">
        <h2>Flexbox Layout</h2>
        <div class="flex-container">
            <div class="flex-item">Header</div>
            <div class="flex-item">Content Section</div>
            <div class="flex-item">Footer</div>
        </div>
    </section>

    <!-- Grid Layout -->
    <section class="content-section">
        <h2>Grid Layout</h2>
        <div class="grid-container">
            <div class="grid-item">Header</div>
            <div class="grid-item">Content Section 1</div>
            <div class="grid-item">Content Section 2</div>
            <div class="grid-item">Footer</div>
        </div>
    </section>

    <!-- Button with Transition -->
    <section class="content-section-trans">
        <h2>Transitions and Animations</h2>
        <button class="btn">Hover over me</button><br>
        <p class="animate">bouncing bouncing bouncing!!!</p><br>
        <img src="/ALC/asset/iPhone 14.png" class="animate2" alt="iphone 14">
    </section>

    <!-- Footer Section -->
    <footer id="footer">
        <p>&copy; 2024 Advanced CSS. All rights reserved.</p>
    </footer>

</body>
</html>
